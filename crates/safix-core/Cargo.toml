[package]
name = "safix-core"
description = "The safix runtime as a library: custody types, drivers, and refusals, with no terminal in it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
# No diagnostic renderer here: rendering belongs to the command, and an embedder
# should not inherit one. `thiserror` produces the variants; `miette` renders
# them, and only `safix` depends on it.
thiserror.workspace = true
secrecy.workspace = true
zeroize.workspace = true
# `derive` because the schemas this reads are the nix half's output and are
# declared as types here; the probe asserting `Secret` is not serializable needs
# the trait in scope besides, and an absence probe against a trait no crate in
# the graph defines would be vacuous.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_norway.workspace = true
# The one asynchronous corner: the bounded fan-out `fix --yes` re-wraps
# governed files through. Every other path is sequential because the staging
# discipline is sequential, so the feature list is the three that fan-out needs
# and nothing that would make reaching for it elsewhere convenient.
tokio = { workspace = true, features = ["rt-multi-thread", "process", "sync"] }
# The pipe a generator's input travels down, and the one flag that has to come
# off a descriptor for the script to inherit it. A safe wrapper over what would
# otherwise be `unsafe` in a crate that forbids it; nothing here opens a
# terminal or catches a signal, which stay the command's.
rustix.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true
