[package]
name = "safix"
description = "The whole lifecycle of one secret, by name and never by file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[[bin]]
name = "safix"
path = "src/main.rs"

[dependencies]
safix-core.workspace = true
thiserror.workspace = true
# `fancy` is the graphical renderer. It is the reason this dependency is
# confined to the command: the library's refusals are data, and an embedder
# takes none of this.
miette = { workspace = true, features = ["fancy"] }
# The terminal and the two signals, both confined here. `#![forbid(unsafe_code)]`
# holds in this crate as it does in the library, so turning echo off and catching
# a signal are reached through crates that carry the `unsafe` rather than
# through an escape hatch opened for them.
rustix.workspace = true
signal-hook.workspace = true

[dev-dependencies]
# The graphical rendering of every refusal is held by a snapshot. It is the one
# channel the differential harness does not compare against the shell runtime,
# so it is pinned against itself instead.
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true
