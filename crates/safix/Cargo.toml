[package]
name = "safix"
description = "The whole lifecycle of one secret, by name and never by file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[[bin]]
name = "safix"
path = "src/main.rs"

# The one thing the integration suite stubs. It is a binary rather than a script
# because it asserts — the attribute the runtime asked for, the mode it read it
# in, the flake it named — and code that states a claim a check makes is tooling
# under this repository's own rule, so it is rust like the rest of it. It lives
# under `tests/` because that is what it is for, and `packages.safix` builds
# `--bin safix` alone so it does not ship.
[[bin]]
name = "safix-nix-stub"
path = "tests/support/nix-stub.rs"

[dependencies]
safix-core.workspace = true
thiserror.workspace = true
# `fancy` is the graphical renderer. It is the reason this dependency is
# confined to the command: the library's refusals are data, and an embedder
# takes none of this.
miette = { workspace = true, features = ["fancy"] }
# The terminal and the two signals, both confined here. `#![forbid(unsafe_code)]`
# holds in this crate as it does in the library, so turning echo off and catching
# a signal are reached through crates that carry the `unsafe` rather than
# through an escape hatch opened for them.
rustix.workspace = true
signal-hook.workspace = true

[dev-dependencies]
# The graphical rendering of every refusal is held by a snapshot, pinned against
# itself.
insta.workspace = true
proptest.workspace = true
# The integration suite writes the fixture documents the stubbed evaluator
# answers with — placements, audiences, the generator plan — which are the nix
# half's own schemas and are built rather than pasted, so a mode that adds a
# generator changes the plan the way an evaluation would. A dev dependency: the
# shipped binary reads no JSON of its own.
serde_json.workspace = true

[lints]
workspace = true
