[package]
name = "safix"
description = "The whole lifecycle of one secret, by name and never by file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[[bin]]
name = "safix"
path = "src/main.rs"

[dependencies]
safix-core.workspace = true
thiserror.workspace = true
# `fancy` is the graphical renderer. It is the reason this dependency is
# confined to the command: the library's refusals are data, and an embedder
# takes none of this.
miette = { workspace = true, features = ["fancy"] }

[lints]
workspace = true
