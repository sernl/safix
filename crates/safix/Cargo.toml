[package]
name = "safix"
description = "The whole lifecycle of one secret, by name and never by file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[[bin]]
name = "safix"
path = "src/main.rs"

# The one thing the integration suite stubs. It is a binary rather than a script
# because it asserts — the attribute the runtime asked for, the mode it read it
# in, the flake it named — and code that states a claim a check makes is tooling
# under this repository's own rule, so it is rust like the rest of it. It lives
# under `tests/` because that is what it is for, and `packages.safix` builds
# `--bin safix` alone so it does not ship.
[[bin]]
name = "safix-nix-stub"
path = "tests/support/nix-stub.rs"

# The perturbations the residue and drill checks put in the runtime's way: a
# sops that records what it was handed, a sops that waits, and a wrapper that
# damages one channel on purpose. Rust for the same reason the stub is: each
# decides whether an assertion is shown to fail.
[[bin]]
name = "safix-test-shim"
path = "tests/support/shim.rs"

# The clan the bridge tests delegate to. Permitted where stubbing sops is not,
# and the file states why: sops is what safix's claims are about, clan is a
# boundary safix delegates across, and what is under test is the delegation. It
# records what it was handed so the claims can be asserted rather than assumed.
[[bin]]
name = "safix-clan-stub"
path = "tests/support/clan-stub.rs"

# The card surface `safix enroll` is driven against: ykman, the age plugin, and
# the two password stores, in one binary with a role in its environment. Stubbed
# for the reason clan is — the claims are about the delegation and a stub can be
# asked what it saw — and for one more that clan does not have: the real tools act
# on hardware holding this fleet's master identities, where one wrong argument is
# an irreversible loss. No check in this repository runs them, so the card the
# suite knows is this file.
[[bin]]
name = "safix-card-stub"
path = "tests/support/card-stubs.rs"

# The ssh-adjacent tools `safix upload` shells out to — ssh-keygen, ssh-to-age,
# ssh-keyscan and ssh — in one binary with a role chosen by the shape of its own
# argument vector, for the reason the clan and card stubs are: the claims are
# about the delegation, and no check in this repository reaches a real network
# or mints a real ed25519 key.
[[bin]]
name = "safix-transport-stub"
path = "tests/support/transport-stub.rs"

# The git the commit-ordering drills point safix at, to refuse one root's
# `commit` invocation on purpose — the half-landed state a vault-first,
# two-commit write must be shown to recover from. Rust for the reason every
# other shim here is: it asserts which invocation it is refusing rather than
# refusing the first one it sees.
[[bin]]
name = "safix-git-shim"
path = "tests/support/git-shim.rs"

# The `pass` the pass suite delegates to. Stubbed for the reason clan is — the
# claims are about the delegation, and a stub can be asked what it saw — and
# unlike every other stub here it is not the only instrument for this boundary:
# `checks.safix-pass-cli` drives the real `pass` over a store it mints in its
# own `GNUPGHOME`, because this is the one target whose tool is free-licensed,
# needs no network and needs no account. So this file answers "what vectors did
# safix send" and that check answers "do those vectors mean to `pass` what
# safix thinks they mean". It refuses an `insert` carrying neither
# `--multiline` nor `--force` and any invocation whose argv carries a value it
# holds, so two of the transport's promises are enforced by the thing safix
# runs.
[[bin]]
name = "safix-pass-stub"
path = "tests/support/pass-stub.rs"

# The Bitwarden client the bitwarden suite delegates to. Stubbed for the reason
# clan is — the claims are about the delegation, and a stub can be asked what it
# saw — and for one the free-licensed `pass` does not have: no check of this
# repository runs the real `bw`, because it cannot authenticate without a
# network and a `nix build` has none, so this file is the only client the suite
# has. `modules/flake/checks/bitwarden.nix` records that absence where the
# checks live rather than leaving it silent. It refuses an invocation missing
# `--nointeraction`, a positional that decodes to a JSON payload, a session key
# anywhere but `BW_SESSION`, and an `edit` whose payload is not a whole item, so
# four of the transport's promises are enforced by the thing safix runs.
[[bin]]
name = "safix-bw-stub"
path = "tests/support/bw-stub.rs"

# The 1Password command the onepassword suite delegates to. Stubbed for the
# reason clan is — the claims are about the delegation, and a stub can be asked
# what it saw — and for one the others do not have: no check of this repository
# may ever run the real program. It is unfree, there is no self-hostable server,
# and every authentication path needs the network, so this file is not a
# stand-in until a real check exists; it is the only `op` this suite will have.
# It refuses any argument word carrying `=` and any item command naming no
# vault, so two of the transport's promises are enforced by the thing safix runs.
[[bin]]
name = "safix-op-stub"
path = "tests/support/op-stub.rs"

[dependencies]
safix-core.workspace = true
thiserror.workspace = true
# `fancy` is the graphical renderer. It is the reason this dependency is
# confined to the command: the library's refusals are data, and an embedder
# takes none of this.
miette = { workspace = true, features = ["fancy"] }
# The terminal and the two signals, both confined here. `#![forbid(unsafe_code)]`
# holds in this crate as it does in the library, so turning echo off and catching
# a signal are reached through crates that carry the `unsafe` rather than
# through an escape hatch opened for them.
rustix.workspace = true
signal-hook.workspace = true
# The picker's `*` and wildcard terms. `regex-lite` rather than `regex`: the
# patterns are typed by a person into a query line over tens of candidates, so
# the automaton-size and match-speed engineering the full crate carries buys
# nothing here, and its unicode tables are a megabyte of binary for a table of
# names drawn from `[a-z0-9._/-]`.
regex-lite.workspace = true
# The picker's own settings file, which is the one JSON the shipped binary reads
# and writes. It is not a schema anything else declares — three fields the picker
# itself wrote — and it is parsed as a tree rather than into a type because a
# corrupt one is ignored per field rather than refused.
serde_json.workspace = true

[dev-dependencies]
# The graphical rendering of every refusal is held by a snapshot, pinned against
# itself.
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true
