# Runs the flake's own check surface on every push and pull request.
#
# `nix flake check` builds every check rather than only evaluating them, which
# is the point: the command's self-tests drive the real sops, the real age and
# the real git against a throwaway repository, and evaluation alone would prove
# nothing about them.
#
# Two jobs, run together rather than one behind the other, because the two kinds
# of failure cost different amounts to find. `eval` evaluates the flake for every
# system safix declares and builds only the two formatters, so an output that
# stopped existing on aarch64-linux — a platform this workflow rents no runner for
# — and a misformatted file are both red marks in half a minute rather than at
# the end of a build. `build` then builds the surface on the two platforms GitHub
# does rent. Running them side by side rather than in sequence is deliberate: the
# fast answer is worth having early and is not worth making the slow one wait for.
#
# `build` runs nix-fast-build rather than `nix flake check`. `nix flake check`
# stops at the first failing derivation and then names every other check as
# failed without having run it, so a red run reports one check and withholds
# the other ninety-seven; nix-fast-build builds each attribute independently
# and reports each, and the junit file names every one that went red. It is
# also what the rest of this fleet's flakes are checked with.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  eval:
    name: eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            keep-going = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            download-attempts = 10

      # `nix flake check --no-build` is not the tool for this, and the reason is
      # the tree rather than the flag. `safix-module-collision` imports a module
      # out of a store path `builtins.path` produced and `safix-generators` reads
      # a fixture out of a derivation, so evaluating either demands a realised
      # path; under `--no-build` nix computes the path and then refuses the path
      # it computed, on this runner's own system and not only on another's. Adding
      # `--all-systems` only moves the refusal to a platform mismatch. Either way
      # it reports nothing about any of the ninety-eight, which is how the command
      # was hiding the failures this workflow was written to find.
      #
      # Instantiation therefore belongs to the build job, whose nix-eval-jobs
      # realises what an evaluation demands. What is reachable from here is
      # narrower, and worth being exact about: `nix flake show --all-systems`
      # evaluates the flake's module system once per declared system and forces
      # the attribute set each one produces, down to every derivation's name. It
      # does not force any check's body — a `runCommand`'s name is a literal, and
      # its inputs stay unevaluated — so this is not a check of the checks. It is
      # a check that all three systems still produce the surface they are supposed
      # to, which is the failure aarch64-linux would otherwise report to nobody,
      # and it costs ten seconds to ask.
      - name: every declared system still produces its surface
        run: nix flake show --all-systems --json > /dev/null

      # Both formatters are checks of the flake and are built again by the build
      # job. They are also the two failures a contributor is most likely to arrive
      # with and the two cheapest to establish, and a formatting mistake answered
      # in three minutes is worth the second build. These are `nix build` rather
      # than part of the step above because a formatter has to run to say anything.
      - name: the tree is formatted
        if: ${{ !cancelled() }}
        run: |
          nix build --no-link --print-build-logs \
            '.#checks.x86_64-linux.treefmt' \
            '.#checks.x86_64-linux.safix-rs-fmt'

  build:
    name: build (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      # Hoisted to job scope because a step `if` cannot read the secrets
      # context; the cachix step and the build step both condition on this.
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          # The arm half of linux, on the arm64 runner GitHub provides free to
          # public repositories. Same kernel, same apparmor restriction, same
          # full surface: the user-namespace step below keys on the operating
          # system rather than the architecture, so this leg needs nothing of
          # its own.
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          # This leg runs a scoped surface, and the scope is the runner's rather
          # than the platform's. A generator fragment runs inside
          # `/usr/bin/sandbox-exec` on darwin, and a GitHub macOS runner will not
          # let it apply a profile at all:
          #
          #     sandbox-exec: sandbox_apply: Operation not permitted
          #     safix: the generator for 'slow' exited 71; nothing was written.
          #
          # nix's own sandbox is not the obstacle — it reports `sandbox = false`
          # on this runner already — so unlike ubuntu's user-namespace
          # restriction there is nothing left to relax. Four generator tests of
          # `abort_residue` fail on it, `safix-integration` runs every target in
          # one derivation and so fails with them, and every check that runs one
          # of its tests fails for want of a suite to run.
          #
          # What is excluded is therefore that whole family, and it is derived
          # rather than listed: the step below asks the store which checks need
          # the integration suite and removes exactly those. Nothing narrows on
          # linux, nothing is narrowed in the flake, and a real Mac — which can
          # apply a sandbox profile — still gets every check under `nix flake
          # check`. This is a statement about a rented runner, made where the
          # runner is rented.
          - system: aarch64-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No step frees disk for the store, because the surface does not need one.
      # The whole of it — this flake's nixpkgs closure, the second one clan-core
      # pins for the nested clan that `safix-bridge-real-clan` builds inside
      # itself, a rust toolchain and a Qt application — comes to 8.5 GiB, against
      # 87 GiB free on a linux runner and 97 GiB on a darwin one. The last step of
      # this job reports the store's size and what is left on the filesystem, so
      # the day a runner image or the surface changes that arithmetic the run says
      # so rather than dying of a full disk. Reclaiming the image's own tooling
      # was tried and taken back out: it left `/` at one gigabyte free, which is a
      # new way to fail in exchange for headroom nothing was using.
      # `access-tokens` is what makes a run repeatable rather than a coin toss.
      # Six of this flake's inputs are `github:` references, and nix fetches those
      # through `api.github.com`, which rate-limits an unauthenticated caller by
      # source address — sixty requests an hour shared with every other runner
      # behind the same egress. Runs died in `nix-eval-jobs` on HTTP 429 before
      # evaluating a single check, and the darwin runners died more often than the
      # linux ones. The job's own token raises that ceiling and is scoped to
      # reading this repository.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            keep-going = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            download-attempts = 10
            extra-substituters = https://sernl-safix.cachix.org
            extra-trusted-public-keys = sernl-safix.cachix.org-1:1AR/W7vHqw4fOVvY9lr79O4N2JigaPTf2sJSUEVXoZQ=

      # Substitution needs no secret — the cache is public and its signing key
      # is above, so every run reads it, forks and secretless events included.
      # Pushing is the half a token gates: this step installs and authenticates
      # the cachix client when `CACHIX_AUTH_TOKEN` exists, and skips pushing
      # itself because nix-fast-build below uploads each result as it is built
      # rather than in one sweep at the end of the job.
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        with:
          name: sernl-safix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      # Ubuntu 24.04 ships `kernel.apparmor_restrict_unprivileged_userns` at 1,
      # which denies a user namespace to a process that is unconfined and has no
      # CAP_SYS_ADMIN. The nix daemon is root and clears that bar; the builder it
      # starts runs as uid 1000 with an empty effective capability set and does
      # not. bubblewrap is made of user namespaces, and the checks that drive a
      # generator run bubblewrap nested inside the nix build sandbox, so with the
      # restriction in place the runtime's own probe finds no backend and every
      # such check fails. It is nix's sandbox that is innocent here: it
      # pivot_roots rather than chroots, so the kernel's own `current_chrooted`
      # guard does not fire, and the same envelope runs nested without complaint
      # on a machine that does not carry Ubuntu's restriction.
      #
      # Those checks are meant to fail on a machine that cannot run the envelope.
      # This is the machine being made able to run it, rather than the checks
      # being narrowed to what an unmodified runner happens to allow.
      #
      # The second knob is Ubuntu 25.04 and later, where unconfined processes are
      # gated separately. It is absent on 24.04, which is why its presence is
      # asked rather than assumed. darwin has no counterpart to this step and
      # needs none: its backend is `/usr/bin/sandbox-exec`, which the system
      # supplies and no sysctl withholds.
      - name: let bubblewrap have a user namespace
        if: runner.os == 'Linux'
        run: |
          for knob in kernel.apparmor_restrict_unprivileged_userns \
                      kernel.apparmor_restrict_unprivileged_unconfined; do
            if sysctl -n "$knob" >/dev/null 2>&1; then
              sudo sysctl -w "$knob=0"
            else
              echo "$knob is not a knob on this kernel"
            fi
          done

      # The scope this runner can execute, asked rather than remembered.
      #
      # `safix-integration` compiles the suite and runs every target of it in one
      # derivation, and each check that names a behavioural mode runs one test out
      # of that build. So a runner that cannot apply a sandbox profile fails four
      # generator tests, fails the suite with them, and fails every check built on
      # the suite for want of one. That family is what comes out here, and it
      # comes out by provenance: `--referrers-closure` names every derivation that
      # reaches the suite's, and the checks whose own derivations are in that set
      # are exactly the ones a runner without the envelope cannot execute.
      #
      # Derived and not listed, because a list would be a second place to
      # remember a check exists — a new mode added to the suite joins this family
      # on the day it is written, without anybody editing this file. The excluded
      # names are printed and put in the job summary, so a run says what it did
      # not do rather than quietly doing less.
      - name: which checks this runner cannot execute
        if: runner.os == 'macOS'
        id: scope
        run: |
          suite=$(nix path-info --derivation '.#checks.${{ matrix.system }}.safix-integration')
          nix run --inputs-from . --option flake-registry '' nixpkgs#nix-eval-jobs -- \
            --flake '.#checks.${{ matrix.system }}' --workers 4 \
            | jq -r 'select(.drvPath != null) | "\(.attr)\t\(.drvPath)"' > attrs.tsv
          nix-store --query --referrers-closure "$suite" > dependents.txt

          excluded=$(awk -F'\t' 'NR==FNR { seen[$0]; next } ($2 in seen) { print $1 }' \
            dependents.txt attrs.tsv | sort)
          if [ -z "$excluded" ]; then
            echo "nothing reaches the integration suite, which cannot be right" >&2
            exit 1
          fi

          quoted=$(printf '%s\n' "$excluded" | sed 's/.*/"&"/' | tr '\n' ' ')
          echo "select=checks: builtins.removeAttrs checks [ $quoted]" >> "$GITHUB_OUTPUT"

          total=$(wc -l < attrs.tsv | tr -d ' ')
          count=$(printf '%s\n' "$excluded" | wc -l | tr -d ' ')
          {
            echo "### Excluded on this runner"
            echo
            echo "$count of $total checks need the integration suite, which needs an"
            echo "envelope this runner cannot apply. A real Mac builds all $total."
            echo
            printf '%s\n' "$excluded" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$excluded"

      # `--inputs-from .` so that `nixpkgs` means the nixpkgs this flake pins,
      # rather than whatever the global registry resolves it to: a second nixpkgs
      # would be a second closure to fetch for one tool. With the flake supplying
      # the name, the global registry has nothing left to answer, and emptying it
      # takes `channels.nixos.org` out of the run — which is one less thing to be
      # down while a check is trying to establish something.
      #
      # `--eval-workers 4` bounds the contention between nix-eval-jobs' worker
      # processes on the shared sqlite eval cache; more workers than that turn
      # into lock waits rather than throughput.
      #
      # nix-fast-build writes its own job summary when it finds itself on
      # Actions: successful logs folded, every failure unfolded with its last
      # hundred lines. That is the report a reader wants, and the junit file
      # below is the same result for anything that reads results rather than logs.
      #
      # There is no store cache, and that is a measurement rather than an
      # omission. cache.nixos.org supplies most of the closure and `--skip-cached`
      # takes it from there; what no public cache has is crane's dependency
      # artifact and clan-cli. Holding those in the Actions cache means holding
      # the 8.5 GiB store they sit in, per platform, against a repository budget
      # of ten gigabytes — most of the budget, evicted often, to save under four
      # minutes of a fifteen-minute run. The lever worth pulling is a binary cache
      # with a token, and it is wired: when the `CACHIX_AUTH_TOKEN` secret
      # exists, the cachix step above substitutes from `sernl-safix` and the
      # invocation below pushes each result to it as it is built.
      - name: build every check, and report every failure rather than the first
        env:
          SELECT: ${{ steps.scope.outputs.select }}
        run: |
          # Empty on linux, where the step that sets it does not run and the whole
          # surface is built.
          scope=()
          if [ -n "${SELECT:-}" ]; then
            scope=(--select "$SELECT")
          fi

          # Push exactly when the token exists, which is also when the cachix
          # step configured substitution.
          cache=()
          if [ -n "${CACHIX_AUTH_TOKEN:-}" ]; then
            cache=(--cachix-cache sernl-safix)
          fi

          nix run --inputs-from . --option flake-registry '' nixpkgs#nix-fast-build -- \
            --flake '.#checks.${{ matrix.system }}' \
            --skip-cached \
            --no-nom \
            --eval-workers 4 \
            --result-format junit \
            --result-file check-results.xml \
            "${scope[@]}" "${cache[@]}"

      - name: the junit file itself
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-results-${{ matrix.system }}
          path: check-results.xml
          if-no-files-found: warn

      - name: what the surface cost in disk
        if: always()
        run: |
          df -h /
          sudo du -sh /nix/store || true
